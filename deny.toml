# SPDX-License-Identifier: GPL-2.0-only
# cargo-deny: security advisories, duplicate-version policy and registry
# sources. Dependency LICENSES ARE NOT GATED - the project stopped constraining
# its dependency graph by license; see docs/ARCHITECTURE.md §11.

[advisories]
# Each ignore is justified by our *actual* usage, not waved away. Re-audit an
# entry whenever the crate that pulls it in is bumped.
ignore = [
    # `paste`: unmaintained, but a *build-time* proc-macro with no runtime or
    # security surface, pulled transitively by RustCrypto crates.
    "RUSTSEC-2024-0436",
    # `rsa` "Marvin Attack": a timing sidechannel in RSA PKCS#1 v1.5
    # *decryption* (a private-key operation). We are a TLS *client*:
    # rustls-rustcrypto uses `rsa` only to VERIFY the server's certificate
    # signature (a public-key operation), so the vulnerable path is not
    # exercised. No fix exists upstream.
    "RUSTSEC-2023-0071",
    # `rustls-webpki` 0.102.8 (CRL matching, URI/wildcard name constraints, CRL
    # parse panic): our certificate chain verification runs through
    # rustls-webpki 0.103.13 (patched, via rustls 0.23). We only pull 0.102.8
    # because rustls-rustcrypto imports its `alg_id` OID *constants*; the
    # vulnerable CRL/name-constraint code is never invoked.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Rune (the GUI toolkit) is not on crates.io yet; it is pinned to a commit in
# Cargo.toml, so the git source cannot move under us.
allow-git = ["https://github.com/anomalyco/rune"]
