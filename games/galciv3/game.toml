# Galactic Civilizations III - Stardock. Ported from Vortex's game-galciv3.
# Vortex's id is "galacticcivilizations3" (the Nexus domain); this def's id
# matches the folder slug per Modrix's rule.
#
# Mods deploy to the user profile (mod_base) rather than the install dir; on
# Linux this is inside the game's Proton prefix.
api_version    = 2
id             = "galciv3"
name           = "Galactic Civilizations III"
steam_appid    = 976210
gog_id         = "1444400383"
nexus_domain   = "galacticcivilizations3"
mod_root       = "My Games/GalCiv3/Mods"
mod_base       = "documents"
deploy         = "link"
install_probe  = ["steam", "gog", "registry"]
required_files = ["GalCiv3.exe"]

[[registry_keys]]
hive  = "HKLM"
key   = "SOFTWARE\\WOW6432Node\\GOG.com\\Games\\1444400383"
value = "path"
