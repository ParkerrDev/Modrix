# Enderal: Forgotten Stories - a total conversion built on Skyrim (Legendary
# Edition, TESV.exe). Ported from Vortex's game-enderal. Mods deploy into Data/,
# load order lives in Plugins.txt under local app data, and SKSE is the script
# extender. Discovered via SureAI's own registry key, not Steam's Skyrim entry.
api_version    = 2
id             = "enderal"
name           = "Enderal: Forgotten Stories"
steam_appid    = 933480
nexus_domain   = "enderal"
mod_root       = "Data"
deploy         = "link"
install_probe  = ["steam", "registry"]
required_files = ["Enderal Launcher.exe", "TESV.exe"]

[[registry_keys]]
hive  = "HKCU"
key   = "SOFTWARE\\SureAI\\Enderal"
value = "Install_Path"

content_dirs = [
  "meshes", "textures", "scripts", "interface", "sound", "music", "video",
  "strings", "seq", "grass", "shadersfx", "lodsettings", "materials", "source",
  "facegen", "distantlod", "trees", "mcm", "skse", "f4se", "nvse", "obse",
  "fose", "sfse", "fomod",
]

base_files = [
  "skyrim.esm", "update.esm", "dawnguard.esm", "hearthfires.esm",
  "dragonborn.esm", "highrestexturepack*.esp",
]

[load_order]
strategy    = "plugins_txt"
appdata_dir = "Enderal"

[[external_scan]]
kind      = "file"
label     = "plugin"
exts      = ["esp", "esm"]
skip_base = true

[[external_scan]]
kind  = "file"
label = "SKSE plugin"
dir   = "SKSE/Plugins"
exts  = ["dll"]

[health.loader]
plugins_dir = "SKSE/Plugins"
root_prefix = "skse"
message     = "SKSE plugins are installed but the SKSE loader is missing - install Skyrim Script Extender (SKSE)"
