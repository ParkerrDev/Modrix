# SPDX-License-Identifier: GPL-2.0-only
# The Elder Scrolls V: Skyrim (Legendary/classic) - Bethesda/Gamebryo
# (Creation Engine). Ported from Vortex's game-skyrim. Mods deploy into Data/,
# load order lives in Plugins.txt under local app data, and SKSE is the script
# extender.
api_version    = 2
id             = "skyrim"
name           = "Skyrim"
steam_appid    = 72850
nexus_domain   = "skyrim"
mod_root       = "Data"
deploy         = "link"
install_probe  = ["steam", "registry"]
required_files = ["TESV.exe"]

[[registry_keys]]
hive  = "HKLM"
key   = "SOFTWARE\\WOW6432Node\\Bethesda Softworks\\Skyrim"
value = "Installed Path"

content_dirs = [
  "meshes", "textures", "scripts", "interface", "sound", "music", "video",
  "strings", "seq", "grass", "shadersfx", "lodsettings", "materials", "source",
  "facegen", "distantlod", "trees", "mcm", "skse", "f4se", "nvse", "obse",
  "fose", "sfse", "fomod",
]

base_files = [
  "skyrim.esm", "update.esm", "dawnguard.esm", "hearthfires.esm",
  "dragonborn.esm", "highrestexturepack*.esp",
]

[load_order]
strategy    = "plugins_txt"
appdata_dir = "Skyrim"

[[external_scan]]
kind      = "file"
label     = "plugin"
exts      = ["esp", "esm", "esl"]
skip_base = true

[[external_scan]]
kind  = "file"
label = "SKSE plugin"
dir   = "SKSE/Plugins"
exts  = ["dll"]

[health.loader]
plugins_dir = "SKSE/Plugins"
root_prefix = "skse"
message     = "SKSE plugins are installed but the SKSE loader is missing - install Skyrim Script Extender"
