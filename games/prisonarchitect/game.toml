# SPDX-License-Identifier: GPL-2.0-only
# Prison Architect. Ported from Vortex's game-prisonarchitect (discovered via an
# Introversion registry key, falling back to Steam). No load-order file.
#
# Mods deploy to the user profile (mod_base) rather than the install dir; on
# Linux this is inside the game's Proton prefix.
api_version    = 2
id             = "prisonarchitect"
name           = "Prison Architect"
steam_appid    = 233450
nexus_domain   = "prisonarchitect"
mod_root       = "Introversion/Prison Architect/mods"
mod_base       = "local_appdata"
deploy         = "link"
install_probe  = ["steam", "registry"]
required_files = ["Prison Architect64.exe"]

[[registry_keys]]
hive  = "HKLM"
key   = "SOFTWARE\\Introversion Software\\Prison Architect"
value = "Install Dir"
