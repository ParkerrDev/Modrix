<!doctype html>
<!-- SPDX-License-Identifier: GPL-2.0-only -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Modrix Bridge</title>
    <style>
      /* Aurora: Modrix's dark-glass identity (see crates/modrix-gui/theme.rs). */
      :root {
        --bg: #0b0e14; --card: #131a28; --hairline: #242c40;
        --text: #e6eaf2; --muted: #8c94a8; --faint: #5b6478;
        --accent: #22d3ee;
        --gradient: linear-gradient(135deg, #22d3ee, #6366f1, #a855f7);
      }
      body {
        font: 14px system-ui, sans-serif; margin: 0; min-width: 22rem;
        max-width: 32rem; background: var(--bg); color: var(--text);
      }
      .wrap { padding: 18px 20px 22px; }
      h1 {
        font-size: 1.05rem; margin: 0 0 4px;
        background: var(--gradient);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        letter-spacing: 0.04em;
      }
      label { display: block; margin: 12px 0 4px; font-weight: 600; color: var(--muted); }
      input {
        width: 100%; padding: 8px 10px; box-sizing: border-box;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--hairline); border-radius: 8px;
      }
      input:focus { outline: none; border-color: var(--accent); }
      button {
        margin-top: 14px; padding: 8px 16px; cursor: pointer;
        border: none; border-radius: 8px; font-weight: 600;
        background: var(--gradient); color: #061b22;
      }
      button.ghost {
        background: transparent; color: var(--muted);
        border: 1px solid var(--hairline);
      }
      button.ghost:hover { color: var(--text); border-color: var(--accent); }
      #status { margin-top: 12px; min-height: 1.2em; color: var(--accent); }
      .hint { color: var(--muted); font-size: 0.9em; }
      details {
        margin-top: 16px; background: var(--card);
        border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 14px;
      }
      summary { cursor: pointer; font-weight: 600; color: var(--faint); }
    </style>
  </head>
  <body>
    <div class="wrap">
    <h1>MODRIX BRIDGE</h1>
    <p class="hint">
      No setup needed: with Modrix (the app or <code>modrix serve</code>)
      running, mod downloads you start in the browser are handed to it
      automatically, authenticated with your own browser session.
    </p>
    <div>
      <button id="test">Test connection</button>
    </div>
    <div id="status"></div>
    <details>
      <summary>Advanced</summary>
      <label for="port">Port</label>
      <input id="port" type="number" min="1" max="65535" placeholder="41015" />
      <label for="token">Session token (optional)</label>
      <input id="token" type="text" placeholder="only needed if origin auth is disabled" />
      <button id="save" class="ghost">Save</button>
    </details>
    </div>
    <script src="options.js"></script>
  </body>
</html>
