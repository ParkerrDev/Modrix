<!doctype html>
<!-- SPDX-License-Identifier: GPL-2.0-only -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Modrix Bridge</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 20px; max-width: 32rem; }
      h1 { font-size: 1.1rem; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      input { width: 100%; padding: 8px; box-sizing: border-box; }
      button { margin-top: 14px; padding: 8px 14px; cursor: pointer; }
      #status { margin-top: 12px; min-height: 1.2em; }
      .hint { color: #666; font-size: 0.9em; }
      details { margin-top: 16px; }
      summary { cursor: pointer; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Modrix Bridge</h1>
    <p class="hint">
      No setup needed: with Modrix (the app or <code>modrix serve</code>)
      running, mod downloads you start in the browser are handed to it
      automatically, authenticated with your own browser session.
    </p>
    <div>
      <button id="test">Test connection</button>
    </div>
    <div id="status"></div>
    <details>
      <summary>Advanced</summary>
      <label for="port">Port</label>
      <input id="port" type="number" min="1" max="65535" placeholder="41015" />
      <label for="token">Session token (optional)</label>
      <input id="token" type="text" placeholder="only needed if origin auth is disabled" />
      <button id="save">Save</button>
    </details>
    <script src="options.js"></script>
  </body>
</html>
