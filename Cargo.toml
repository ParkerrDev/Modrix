[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-2.0-only"
authors = ["Modrix contributors"]

[workspace.dependencies]
# --- internal crates ---
modrix-core = { path = "crates/modrix-core" }
modrix-plugin = { path = "crates/modrix-plugin" }
modrix-download = { path = "crates/modrix-download" }
modrix-ipc = { path = "crates/modrix-ipc" }
modrix-mcp = { path = "crates/modrix-mcp" }
modrix-registry = { path = "crates/modrix-registry" }
modrix-service = { path = "crates/modrix-service" }
# --- external (pinned; further deps added per phase as they are used) ---
anyhow = "1"
thiserror = "2"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
# --- async runtime (Phase 2) ---
# NOTE: the HTTP *client* stack does NOT use reqwest - it transitively pulls
# Apache-2.0-encumbered crates (`ring`, `sync_wrapper`), which are GPLv2-
# incompatible. The download pipeline (added next) assembles a pure-Rust,
# GPLv2-clean stack instead: hyper + rustls + a RustCrypto crypto provider +
# the OS trust store, all MIT/ISC. See docs/ARCHITECTURE.md §8/§11.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time",
] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-rustcrypto = "=0.0.2-alpha"      # pure-Rust CryptoProvider (RustCrypto primitives)
rustls-native-certs = "0.8"             # OS trust store (avoids CDLA webpki-roots)
getrandom = "0.3"
iced = { version = "0.13", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "auto-detect-theme", "canvas", "image"] }
# FOMOD installer config parsing (read-only XML DOM; MIT arm of MIT/Apache dual).
roxmltree = "0.20"
# Decode Steam artwork + bake the per-game backdrop / extract accent colors
# (GUI only; MIT arm of MIT/Apache dual; the same 0.24 iced already resolves).
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
# Sandboxed Lua host for Tier-2 game plugins (MIT; vendors Lua 5.4, also MIT).
mlua = { version = "0.10", default-features = false, features = ["lua54", "vendored"] }
# Native file-open dialogs via the XDG portal (MIT; no GTK linkage).
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
wiremock = "0.6"
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
md-5 = "0.10"      # Nexus publishes file MD5s; RustCrypto, MIT/Apache
# zip for reading mod archives. We DECOMPRESS only, so we take the pure-Rust
# flate2 (miniz_oxide) backend and never enable `deflate` (which would pull in
# zopfli, an Apache-2.0-only crate rejected by our GPLv2 license gate).
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
proptest = "1"

# --- Power of Ten for Rust - enforced workspace-wide (see docs/ARCHITECTURE.md §9.3) ---
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_code = "deny"
unreachable_patterns = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"                 # `.unwrap()` is a silent abort-on-error
panic = "deny"
todo = "deny"
unimplemented = "deny"
expect_used = "warn"                 # justified form: `.expect("why it can't fail")`
indexing_slicing = "deny"            # `v[i]` can panic; use `.get(i)`
arithmetic_side_effects = "warn"     # promote to "deny" in modrix-core
mem_forget = "deny"
undocumented_unsafe_blocks = "warn"
allow_attributes = "warn"            # prefer `#[expect(..)]` over `#[allow(..)]`
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stdout = "warn"                # frontends print via their own sink, not core
print_stderr = "warn"

[profile.release]
overflow-checks = true               # Power of Ten: no silent integer wraparound
